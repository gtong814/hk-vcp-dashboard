name: Daily HK GGT VCP Scan

on:
  schedule:
    - cron: '45 8 * * 1-5'  # UTC 08:45 = HKT 16:45 (星期一至五)
  workflow_dispatch:         # 允許在 GitHub 網頁手動執行

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_results.csv
          git diff --staged --quiet || git commit -m "Update daily HK GGT scan results"
          git push
